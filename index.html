<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emile Souro Kamano – Mes activités</title>
<meta name="description" content="Activités, projets et engagements d’Emile Souro Kamano.">
<meta property="og:title" content="Emile Souro Kamano – Mes activités">
<meta property="og:type" content="website">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4e0d6;--acc:#1f6f5c;--acc-ink:#fff;--chip:#ece8dd}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c212b;--ink:#eceff4;--mute:#9aa4b5;--line:#2c3340;--acc:#4fb89e;--acc-ink:#0c1512;--chip:#262d39;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:720px;margin:0 auto;padding:0 18px}
header{padding-top:40px;padding-bottom:8px}
h1{font:700 2.1rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.bio{margin:0 0 20px;white-space:pre-wrap}
.contact{display:inline-block;margin-bottom:20px;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 22px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.82rem;color:var(--mute);margin-bottom:6px}
.tag{background:var(--chip);color:var(--ink);padding:2px 10px;border-radius:999px}
.card h2{font-size:1.1rem;margin:0 0 4px}
.card p{margin:0;white-space:pre-wrap}
.card a{color:var(--acc);display:inline-block;margin-top:8px}
.empty{color:var(--mute);text-align:center;padding:36px 0}
footer{padding-top:24px;padding-bottom:40px;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<header>
<h1 id="nom">Emile Souro Kamano</h1>
<p class="sub" id="sub">Mes activités : études, projets et engagements</p>
<p class="bio" id="bio" hidden></p>
<a class="contact" id="contact" hidden></a>
</header>
<main>
<div class="chips" id="chips"></div>
<div id="list"><div class="empty">Chargement…</div></div>
</main>
<footer id="foot"></footer>
<script>
var $=function(id){return document.getElementById(id)};
var items=[],filter="Toutes";
function safeUrl(u){try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:""}catch(e){return""}}
function fmt(d){if(!d)return"";var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function render(){
  var chips=$("chips");chips.innerHTML="";
  var cats=["Toutes"];items.forEach(function(i){if(i.categorie&&cats.indexOf(i.categorie)<0)cats.push(i.categorie)});
  if(cats.length>2)cats.forEach(function(c){
    var b=el("button","chip",c);b.type="button";b.setAttribute("aria-pressed",String(c===filter));
    b.onclick=function(){filter=c;render()};chips.append(b)});
  var list=$("list");list.innerHTML="";
  var shown=items.filter(function(i){return filter==="Toutes"||i.categorie===filter});
  if(!shown.length){list.append(el("div","empty",items.length?"Aucune activité dans cette catégorie.":"Aucune activité publiée pour l’instant."));return}
  shown.forEach(function(i){
    var card=el("article","card"),meta=el("div","meta");
    if(i.categorie)meta.append(el("span","tag",i.categorie));
    if(i.date)meta.append(el("span",null,fmt(i.date)));
    card.append(meta,el("h2",null,i.titre||""));
    if(i.description)card.append(el("p",null,i.description));
    var u=safeUrl(i.lien||"");
    if(u){var a=el("a",null,"Voir le lien");a.href=u;a.target="_blank";a.rel="noopener noreferrer";card.append(a)}
    list.append(card)});
}
function init(d){
  if(d.nom)$("nom").textContent=d.nom;
  if(d.sous_titre)$("sub").textContent=d.sous_titre;
  if(d.presentation){$("bio").textContent=d.presentation;$("bio").hidden=false}
  if(d.contact){var c=$("contact"),t=d.contact;
    if(t.indexOf("@")>0&&t.indexOf("/")<0){c.href="mailto:"+t;c.textContent="Me contacter : "+t}
    else{var u=safeUrl(t);if(u){c.href=u;c.textContent="Me contacter"}}
    c.hidden=!c.href}
  $("foot").textContent="© "+new Date().getFullYear()+" "+(d.nom||"");
  items=(d.activites||[]).slice().sort(function(a,b){return(b.date||"").localeCompare(a.date||"")});
  render();
}
fetch("activites.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(init)
.catch(function(){$("list").innerHTML="";$("list").append(el("div","empty","Impossible de charger les activités pour le moment."))});
</script>
</body>
</html>
